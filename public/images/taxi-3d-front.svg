<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.28" stop-color="#FF9A1F"/>
      <stop offset="0.62" stop-color="#F5821F"/>
      <stop offset="1" stop-color="#B8530B"/>
    </linearGradient>
    <linearGradient id="paintSide" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FFAE33"/>
      <stop offset="1" stop-color="#C8620C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#121822"/>
      <stop offset="0.55" stop-color="#2C3546"/>
      <stop offset="1" stop-color="#0B1018"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F6FA"/>
      <stop offset="0.45" stop-color="#9FB0C4"/>
      <stop offset="1" stop-color="#556579"/>
    </linearGradient>
    <radialGradient id="underglow">
      <stop offset="0" stop-color="#4E8FE0" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#2C5DAA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2C5DAA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#FFD25E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feOffset in="b" dx="0" dy="16" result="o"/>
      <feFlood flood-color="#000814" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- подсветка снизу -->
  <ellipse cx="210" cy="262" rx="186" ry="26" fill="url(#underglow)" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- тень авто -->
    <ellipse cx="212" cy="252" rx="128" ry="15" fill="#000" opacity="0.38" filter="url(#blur)"/>

    <!-- кузов: капот, крыша, бока -->
    <path d="M92 158 C104 122 140 96 210 92 C280 96 316 122 328 158 L344 220 C348 238 338 250 320 252 L100 252 C82 250 72 238 76 220 Z" fill="url(#paint)"/>
    <path d="M92 158 C104 122 140 96 210 92 L210 252 L100 252 C82 250 72 238 76 220 Z" fill="url(#paintSide)" opacity="0.55"/>

    <!-- лобовое стекло -->
    <path d="M132 138 C150 112 178 104 210 103 C242 104 270 112 288 138 L272 166 H148 Z" fill="url(#glass)"/>
    <path d="M148 140 C166 122 186 116 210 115 L210 118 C188 120 170 126 154 144 Z" fill="#fff" opacity="0.07"/>

    <!-- стойки -->
    <path d="M210 103 L210 166" stroke="#C8620C" stroke-width="3" opacity="0.6"/>

    <!-- крыша и такси-знак -->
    <path d="M166 100 Q210 78 254 100 L246 110 H174 Z" fill="#FF9A1F"/>
    <rect x="186" y="76" width="48" height="17" rx="4" fill="#FFD400"/>
    <rect x="188" y="78" width="44" height="13" rx="3" fill="#F5C400"/>
    <text x="210" y="89" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#1A1200" text-anchor="middle">TAXI</text>

    <!-- капот -->
    <path d="M76 196 C82 176 86 166 100 158 L148 166 L148 196 L76 196 Z" fill="#E27A13" opacity="0.8"/>
    <path d="M344 196 C338 176 334 166 320 158 L272 166 L272 196 L344 196 Z" fill="#D8720E" opacity="0.8"/>
    <path d="M148 172 H272 L268 196 H152 Z" fill="url(#paint)"/>
    <path d="M156 178 H264" stroke="#FFC05A" stroke-width="2" opacity="0.5"/>

    <!-- решётка -->
    <rect x="150" y="198" width="120" height="34" rx="7" fill="url(#chrome)"/>
    <rect x="154" y="202" width="112" height="26" rx="5" fill="#2A3444"/>
    <g stroke="#7C8DA3" stroke-width="2.4">
      <path d="M158 208 H262 M158 214 H262 M158 220 H262 M158 226 H262"/>
    </g>
    <rect x="150" y="232" width="120" height="7" rx="3" fill="url(#chrome)"/>

    <!-- фары -->
    <circle cx="118" cy="206" r="22" fill="url(#lamp)" opacity="0.45" filter="url(#blur)"/>
    <circle cx="302" cy="206" r="22" fill="url(#lamp)" opacity="0.45" filter="url(#blur)"/>
    <circle cx="118" cy="206" r="13" fill="#FFF9DD"/>
    <circle cx="302" cy="206" r="13" fill="#FFF9DD"/>
    <circle cx="118" cy="206" r="9" fill="#FFFFFF"/>
    <circle cx="302" cy="206" r="9" fill="#FFFFFF"/>
    <circle cx="118" cy="206" r="13" fill="none" stroke="url(#chrome)" stroke-width="2.5"/>
    <circle cx="302" cy="206" r="13" fill="none" stroke="url(#chrome)" stroke-width="2.5"/>

    <!-- бампер -->
    <path d="M80 234 C120 250 300 250 340 234 L336 250 C300 264 120 264 84 250 Z" fill="url(#chrome)"/>
    <path d="M96 244 H324" stroke="#3D6FC7" stroke-width="6" opacity="0.85"/>
    <rect x="158" y="244" width="44" height="14" rx="2" fill="#E8C119"/>
    <text x="180" y="255" font-family="Arial" font-size="8" fill="#2A2200" text-anchor="middle">TAXI</text>

    <!-- колёса -->
    <path d="M76 196 q-14 6 -12 26 l4 26 q2 10 14 10 h10 l-2 -62 z" fill="#121620"/>
    <path d="M344 196 q14 6 12 26 l-4 26 q-2 10 -14 10 h-10 l2 -62 z" fill="#121620"/>
    <ellipse cx="84" cy="234" rx="9" ry="18" fill="#1D2430"/>
    <ellipse cx="336" cy="234" rx="9" ry="18" fill="#1D2430"/>

    <!-- блики -->
    <path d="M104 160 C124 128 156 110 196 106" stroke="#FFD08A" stroke-width="5" fill="none" opacity="0.28" stroke-linecap="round"/>
    <path d="M316 168 C302 140 280 124 258 118" stroke="#FFD08A" stroke-width="3" fill="none" opacity="0.18" stroke-linecap="round"/>
  </g>
</svg>
