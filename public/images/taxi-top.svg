<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="300" height="460">
  <defs>
    <linearGradient id="body2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C95E10"/>
      <stop offset="0.25" stop-color="#FF9E2C"/>
      <stop offset="0.75" stop-color="#F5821F"/>
      <stop offset="1" stop-color="#B85208"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="1" stop-color="#394352"/>
    </linearGradient>
  </defs>
  <!-- wheels -->
  <rect x="18" y="110" width="26" height="72" rx="10" fill="#121620"/>
  <rect x="256" y="110" width="26" height="72" rx="10" fill="#121620"/>
  <rect x="18" y="298" width="26" height="72" rx="10" fill="#121620"/>
  <rect x="256" y="298" width="26" height="72" rx="10" fill="#121620"/>
  <!-- body -->
  <rect x="34" y="36" width="232" height="392" rx="46" fill="url(#body2)"/>
  <!-- hood lines -->
  <rect x="56" y="56" width="188" height="104" rx="24" fill="none" stroke="#FFB34A" stroke-width="3" opacity="0.65"/>
  <!-- windshield -->
  <rect x="60" y="176" width="180" height="70" rx="16" fill="url(#glass2)"/>
  <!-- roof sign -->
  <rect x="112" y="252" width="76" height="28" rx="6" fill="#FFC400"/>
  <text x="150" y="271" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">TAXI</text>
  <!-- rear window -->
  <rect x="70" y="300" width="160" height="58" rx="14" fill="url(#glass2)" opacity="0.9"/>
  <!-- lights -->
  <rect x="58" y="392" width="46" height="16" rx="6" fill="#FFF2C4"/>
  <rect x="196" y="392" width="46" height="16" rx="6" fill="#FFF2C4"/>
</svg>
