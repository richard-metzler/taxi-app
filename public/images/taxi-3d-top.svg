<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="300" height="460">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#B85208"/>
      <stop offset="0.16" stop-color="#FF9A1F"/>
      <stop offset="0.5" stop-color="#F5821F"/>
      <stop offset="0.86" stop-color="#FFAE33"/>
      <stop offset="1" stop-color="#A94805"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0D131D"/>
      <stop offset="0.6" stop-color="#2A3445"/>
      <stop offset="1" stop-color="#151C28"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EDF5"/>
      <stop offset="1" stop-color="#6B7C91"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7FB8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FB8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="s" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset in="b" dy="12" result="o"/>
      <feFlood flood-color="#001026" flood-opacity="0.5" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="244" rx="148" ry="220" fill="url(#halo)"/>
  <g filter="url(#s)">
    <!-- колёса -->
    <rect x="16" y="96" width="28" height="78" rx="12" fill="#0E121A"/>
    <rect x="256" y="96" width="28" height="78" rx="12" fill="#0E121A"/>
    <rect x="16" y="292" width="28" height="78" rx="12" fill="#0E121A"/>
    <rect x="256" y="292" width="28" height="78" rx="12" fill="#0E121A"/>
    <rect x="21" y="106" width="10" height="58" rx="5" fill="#283141"/>
    <rect x="269" y="106" width="10" height="58" rx="5" fill="#283141"/>
    <rect x="21" y="302" width="10" height="58" rx="5" fill="#283141"/>
    <rect x="269" y="302" width="10" height="58" rx="5" fill="#283141"/>

    <!-- кузов -->
    <rect x="40" y="30" width="220" height="400" rx="54" fill="url(#paint)"/>
    <path d="M40 96 Q40 30 94 30 H206 Q260 30 260 96 Z" fill="#FFA628" opacity="0.42"/>
    <path d="M40 368 Q40 430 94 430 H206 Q260 430 260 368 Z" fill="#A94A05" opacity="0.28"/>

    <!-- капот и линии -->
    <rect x="58" y="48" width="184" height="116" rx="30" fill="none" stroke="#FFC463" stroke-width="3" opacity="0.62"/>
    <path d="M70 72 H230 M70 140 H230" stroke="#C8620C" stroke-width="2" opacity="0.3"/>
    <path d="M150 48 V164" stroke="#FFCF7A" stroke-width="2" opacity="0.25"/>

    <!-- лобовое стекло -->
    <rect x="60" y="174" width="180" height="76" rx="18" fill="url(#glass)"/>
    <path d="M76 186 H224" stroke="#fff" stroke-width="4" opacity="0.08"/>
    <rect x="58" y="170" width="184" height="5" rx="3" fill="url(#chrome)"/>

    <!-- знак TAXI на крыше -->
    <rect x="108" y="256" width="84" height="30" rx="6" fill="#B88600"/>
    <rect x="111" y="258" width="78" height="24" rx="5" fill="#FFD400"/>
    <text x="150" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#1A1200" text-anchor="middle">TAXI</text>

    <!-- заднее стекло -->
    <rect x="68" y="304" width="164" height="58" rx="16" fill="url(#glass)"/>
    <rect x="66" y="300" width="168" height="5" rx="3" fill="url(#chrome)"/>

    <!-- багажник -->
    <path d="M62 372 H238" stroke="#FFC463" stroke-width="2" opacity="0.5"/>

    <!-- фары и номер -->
    <rect x="56" y="396" width="48" height="18" rx="7" fill="#FFF4C0"/>
    <rect x="196" y="396" width="48" height="18" rx="7" fill="#FFF4C0"/>
    <rect x="112" y="414" width="76" height="16" rx="3" fill="#EBD23A"/>
    <text x="150" y="426" font-family="Arial" font-size="9" fill="#2A2200" text-anchor="middle">TAXI</text>

    <!-- блики -->
    <path d="M64 78 Q64 46 96 44" stroke="#FFD99A" stroke-width="7" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M236 380 Q236 414 204 418" stroke="#FFD99A" stroke-width="5" fill="none" opacity="0.2" stroke-linecap="round"/>
  </g>
</svg>
