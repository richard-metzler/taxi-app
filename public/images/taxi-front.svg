<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA62B"/>
      <stop offset="0.5" stop-color="#F5821F"/>
      <stop offset="1" stop-color="#C95E10"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6FA8F5" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#2C5DAA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#3E4A5F"/>
    </linearGradient>
  </defs>
  <ellipse cx="210" cy="232" rx="190" ry="24" fill="url(#glow)"/>
  <!-- roof + taxi sign -->
  <path d="M120 96 Q210 60 300 96 L286 120 H134 Z" fill="url(#body)"/>
  <rect x="180" y="66" width="60" height="18" rx="4" fill="#FFC400"/>
  <text x="210" y="79" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle">TAXI</text>
  <!-- windshield -->
  <path d="M138 100 Q210 74 282 100 L270 132 H150 Z" fill="url(#glass)"/>
  <!-- body -->
  <path d="M104 126 H316 L338 196 H82 Z" fill="url(#body)"/>
  <!-- grille -->
  <rect x="150" y="150" width="120" height="34" rx="6" fill="#2B3442"/>
  <g stroke="#6E7A8C" stroke-width="2">
    <line x1="158" y1="158" x2="262" y2="158"/>
    <line x1="158" y1="167" x2="262" y2="167"/>
    <line x1="158" y1="176" x2="262" y2="176"/>
  </g>
  <!-- headlights -->
  <circle cx="124" cy="166" r="13" fill="#FFF7D6"/>
  <circle cx="296" cy="166" r="13" fill="#FFF7D6"/>
  <circle cx="124" cy="166" r="20" fill="#FFF7D6" opacity="0.25"/>
  <circle cx="296" cy="166" r="20" fill="#FFF7D6" opacity="0.25"/>
  <!-- bumper -->
  <path d="M86 196 H334 L326 214 H94 Z" fill="#3D6FC7"/>
  <!-- wheels -->
  <rect x="78" y="188" width="26" height="40" rx="6" fill="#141821"/>
  <rect x="316" y="188" width="26" height="40" rx="6" fill="#141821"/>
</svg>
